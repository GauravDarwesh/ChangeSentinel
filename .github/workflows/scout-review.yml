name: Scout Review Decision

# The dashboard's "Not relevant" and "Restore" buttons open a prefilled issue.
# Only issues the repository owner opens are processed; each decision applies to
# the listed URLs only and is recorded in data/scout/decisions.json with an
# append-only log.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  review:
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[ChangeSentinel] Scout review') }}
    runs-on: [self-hosted, macOS, ARM64, changesentinel]
    timeout-minutes: 10
    # Job-level so unrelated issues (for example "Add monitor" requests) never
    # wait behind a running sweep; only real Scout decisions join its queue.
    concurrency:
      group: scout
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # Recording a decision uses only the Python standard library.
      - name: Record decision and commit
        id: record
        run: |
          set -euo pipefail
          git config user.name "changesentinel-scout"
          git config user.email "actions@users.noreply.github.com"
          success=false
          for attempt in 1 2 3; do
            git fetch origin main --quiet
            git checkout -B main origin/main
            python -m regmon.scout review --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/scout-review.json"
            if git diff --quiet -- data/scout; then
              success=true
              break
            fi
            git add -A -- data/scout
            git commit -m "Record Scout review decision (issue #${{ github.event.issue.number }})"
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "Push attempt $attempt did not publish; refreshing main and retrying."
            sleep 2
          done
          if [ "$success" != true ]; then
            echo "Could not publish the Scout decision after three attempts."
            exit 1
          fi
          echo "summary=$(python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"] + "/scout-review.json")); print(d["decision"] + " for " + str(d["count"]) + " candidate(s)")')" >> "$GITHUB_OUTPUT"

      - name: Publish Scout data to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Confirm on the request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.record.outputs.summary }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Recorded $SUMMARY. The dashboard's Scout view updates after the next Pages deploy (about a minute)."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY"

      - name: Explain a rejected request
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Scout could not record this decision. Open the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
