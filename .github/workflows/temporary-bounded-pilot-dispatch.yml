name: One-time Bounded EBA Pilot Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-bounded-pilot-dispatch.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start only the exact-URL pilot source
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run regulatory-monitor.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_id=eba-regulatory-pilot \
            -f test_notification=false
          echo "Dispatched eba-regulatory-pilot only."
