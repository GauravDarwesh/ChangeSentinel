name: Deploy Monitoring Console

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard.js"
      - "README.md"
      - "tests/test_ask_sentinel_contract.py"
      - ".github/workflows/pages.yml"
      - "dashboard-v2.html"
      - "dashboard-lib.js"
      - "data/report.json"
      - "data/latest.json"
      - "data/history/index.json"
      - "data/notifications.json"
      - "data/notification-outbox.json"
      - "config/sources.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp dashboard-v2.html site/dashboard-v2.html
          cp dashboard.js site/dashboard.js
          cp dashboard-lib.js site/dashboard-lib.js
          mkdir -p site/data/history site/config
          cp data/report.json site/data/report.json
          cp data/latest.json site/data/latest.json
          cp data/history/index.json site/data/history/index.json
          cp data/notifications.json site/data/notifications.json
          cp data/notification-outbox.json site/data/notification-outbox.json
          cp config/sources.json site/config/sources.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
