name: Deploy Monitoring Console

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard-v2.html"
      - "dashboard.js"
      - "data/report.json"
      - "data/latest.json"
      - "data/history/index.json"
      - "data/notifications.json"
      - "data/notification-outbox.json"
      - "config/sources.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp dashboard-v2.html site/dashboard-v2.html
          cp dashboard.js site/dashboard.js
          mkdir -p site/data/history site/config
          cp data/report.json site/data/report.json
          cp data/latest.json site/data/latest.json
          cp data/history/index.json site/data/history/index.json
          cp data/notifications.json site/data/notifications.json
          cp data/notification-outbox.json site/data/notification-outbox.json
          cp config/sources.json site/config/sources.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
