name: Deploy Monitoring Console

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard-v2.html"
      - "dashboard.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp dashboard-v2.html site/dashboard-v2.html
          cp dashboard.js site/dashboard.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
