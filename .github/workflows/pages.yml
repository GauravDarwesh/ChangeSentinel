name: Deploy Monitoring Console

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard-v2.html"
      - "dashboard.js"
      - "dashboard-lib.js"
      - "sentinel.js"
      - "sentinel.css"
      - "data/report.json"
      - "data/latest.json"
      - "data/history/index.json"
      - "data/notifications.json"
      - "data/notification-outbox.json"
      - "config/sources.json"
      - "data/scout/latest.json"
      - "data/scout/review.json"
      - "config/scout.json"
      - "config/lineage.json"
      - "config/registry.json"
      - "config/registry-templates.json"
      - "data/link-lineage.json"
      - "data/items/**"
      - "data/proposals.json"
      - "config/regulators.json"
      - "data/calendar.json"
      - "data/health.json"
      - "data/calendar.ics"
      - "data/reviews/ledger.json"
      - "data/digests/index.json"
      - "config/digests.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp dashboard-v2.html site/dashboard-v2.html
          cp dashboard.js site/dashboard.js
          cp dashboard-lib.js site/dashboard-lib.js
          cp sentinel.js site/sentinel.js
          cp sentinel.css site/sentinel.css
          mkdir -p site/data/history site/config
          cp data/report.json site/data/report.json
          cp data/latest.json site/data/latest.json
          cp data/history/index.json site/data/history/index.json
          cp data/notifications.json site/data/notifications.json
          cp data/notification-outbox.json site/data/notification-outbox.json
          cp config/sources.json site/config/sources.json
          mkdir -p site/data/scout
          cp data/scout/latest.json site/data/scout/latest.json
          cp data/scout/review.json site/data/scout/review.json
          cp config/scout.json site/config/scout.json
          cp config/lineage.json site/config/lineage.json
          cp config/regulators.json site/config/regulators.json
          # The regulatory calendar appears after the first scan that builds it.
          # The .ics is served from Pages so calendar apps can subscribe to it.
          mkdir -p site/data/reviews
          mkdir -p site/data/digests
          for f in data/calendar.json data/calendar.ics data/reviews/ledger.json data/health.json data/digests/index.json config/digests.json config/registry-templates.json config/registry.json data/link-lineage.json; do
            if [ -f "$f" ]; then cp "$f" "site/$f"; fi
          done
          # Proposed revisions by form (regmon/proposals.py), read by the Registry's item sheet.
          if [ -f data/proposals.json ]; then cp data/proposals.json site/data/proposals.json; fi
          # The item catalog (regmon/catalog.py): one file per series, read by the
          # Registry's item sheet when an item opens.
          if compgen -G "data/items/*.json" > /dev/null; then
            mkdir -p site/data/items
            cp data/items/*.json site/data/items/
          fi
          # Browsers keep dashboard.js and dashboard-lib.js by their ?v= stamp.
          # Stamp them with this commit, so every deploy reaches every browser
          # (a stamp left unchanged kept people on the old Explore code).
          stamp="${GITHUB_SHA::12}"
          sed -i -E "s/(dashboard(-lib)?\.js|sentinel\.(js|css))\?v=[A-Za-z0-9._-]+/\1?v=${stamp}/g" site/index.html site/dashboard-v2.html
          grep -q "dashboard.js?v=${stamp}" site/index.html
          grep -q "sentinel.js?v=${stamp}" site/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
