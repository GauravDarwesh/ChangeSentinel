name: Regulatory Monitor

on:
  # Monitoring is deliberately decoupled from code pushes. CI validates pushes;
  # this workflow is only for scheduled/manual production scans.
  workflow_dispatch:
    inputs:
      source_id:
        description: Source to monitor (all = every configured source)
        required: false
        default: all
        type: string
      test_notification:
        description: Send controlled ntfy delivery test without changing monitoring state
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *"

# One logical monitoring chain at a time.
# "queue: max" is important: with the default queue mode GitHub cancels an
# older pending run whenever a newer run enters the same concurrency group.
# Continuation runs must never disappear while the current slice is running.
concurrency:
  group: regulatory-monitor
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REGMON_SOURCE: ${{ inputs.source_id || 'all' }}
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Detect active continuation before scheduled scan
        id: schedule-guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          skip=false
          path="data/discovery/eba-full-site.json"
          checkpoint="data/discovery/eba-full-site-checkpoint.json"
          if [ -s "$path" ]; then
            state="$(jq -r '.state // "FAILED"' "$path")"
            if [ "$state" = "PAUSED" ] && [ -s "$checkpoint" ]; then
              skip=true
              echo "Scheduled scan sees an active/resumable continuation; leaving it alone."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: ${{ steps.schedule-guard.outputs.skip != 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.schedule-guard.outputs.skip != 'true' }}
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        if: ${{ steps.schedule-guard.outputs.skip != 'true' }}
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Compile Python
        if: ${{ steps.schedule-guard.outputs.skip != 'true' }}
        run: python -m compileall -q regmon

      - name: EBA discovery seed smoke test
        if: ${{ steps.schedule-guard.outputs.skip != 'true' }}
        run: |
          python - <<'PY'
          import requests
          urls = [
              "https://www.eba.europa.eu/",
              "https://www.eba.europa.eu/homepage",
          ]
          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (compatible; ChangeSentinel/0.5; "
                  "+https://github.com/GauravDarwesh/ChangeSentinel)"
              )
          }
          reachable = 0
          for url in urls:
              try:
                  r = requests.get(url, timeout=30, headers=headers)
                  print(url, "status=", r.status_code, "type=", r.headers.get("content-type"))
                  if r.status_code < 400:
                      reachable += 1
              except Exception as exc:
                  print(url, "ERROR", type(exc).__name__, exc)
          if reachable == 0:
              raise SystemExit("No EBA discovery seed was reachable")
          PY

      - name: Run monitoring engine
        if: ${{ steps.schedule-guard.outputs.skip != 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m regmon.monitor --source "$REGMON_SOURCE"

      - name: Validate monitoring state
        if: ${{ steps.schedule-guard.outputs.skip != 'true' }}
        id: crawl-status
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          requested = os.environ.get("REGMON_SOURCE", "all")
          discovery_dir = Path("data") / "discovery"
          states = []

          for path in sorted(discovery_dir.glob("*.json")):
              if path.name.endswith("-checkpoint.json"):
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              source_id = str(payload.get("source_id") or path.stem)
              state = str(payload.get("state") or "FAILED")
              if requested not in {"all", "*"} and source_id != requested:
                  continue
              states.append((source_id, state))

          if not states:
              raise SystemExit("No discovery metadata found after monitoring engine")

          paused_source = ""
          for source_id, state in states:
              checkpoint = discovery_dir / f"{source_id}-checkpoint.json"
              if state == "PAUSED":
                  if not checkpoint.exists():
                      raise SystemExit(
                          f"{source_id} is PAUSED but its checkpoint is missing; refusing to continue blindly"
                      )
                  if checkpoint.stat().st_size == 0:
                      raise SystemExit(
                          f"{source_id} is PAUSED but its checkpoint is empty; refusing to commit an invalid continuation"
                      )
                  payload = json.loads(checkpoint.read_text(encoding="utf-8"))
                  if payload.get("state") != "PAUSED" or payload.get("source_id") != source_id:
                      raise SystemExit(
                          f"{source_id} has an invalid PAUSED checkpoint; refusing to continue"
                      )
                  if not payload.get("pending") and not payload.get("retry_pending"):
                      raise SystemExit(
                          f"{source_id} is PAUSED with no resumable work in its checkpoint"
                      )
                  if not paused_source:
                      paused_source = source_id

          print(f"states={states}")
          print(f"paused_source={paused_source}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"paused={'true' if paused_source else 'false'}\n")
              handle.write(f"paused_source={paused_source}\n")
          PY

      - name: Publish notifications
        if: ${{ steps.schedule-guard.outputs.skip != 'true' && steps.crawl-status.outputs.paused != 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REQUIRE_NTFY: "0"
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
        run: python -m regmon.notify

      - name: Controlled notification test
        if: ${{ steps.schedule-guard.outputs.skip != 'true' && inputs.test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REQUIRE_NTFY: "1"
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
        run: python -m regmon.notify --test

      - name: Commit monitoring state
        if: ${{ steps.schedule-guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "regulatory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            echo "No monitoring data changes to commit."
            exit 0
          fi

          git commit -m "Update regulatory monitoring state"

          # A human/code push can happen while the long crawl is running.
          # Rebase the data-only state commit when that is a clean fast-forward
          # opportunity; never overwrite a newer main branch.
          for attempt in 1 2 3; do
            git fetch origin main --quiet
            if git merge-base --is-ancestor HEAD origin/main; then
              git push origin HEAD:main
              exit 0
            fi

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Remote main advanced independently; rebasing state commit."
              git rebase origin/main
            else
              echo "Remote main diverged; refusing to overwrite newer history."
              exit 1
            fi

            sleep 3
          done

          echo "Could not publish monitoring state after retries."
          exit 1

      - name: Continue paused crawl
        if: ${{ steps.schedule-guard.outputs.skip != 'true' && steps.crawl-status.outputs.paused == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_id="${{ steps.crawl-status.outputs.paused_source }}"
          test -n "$source_id"
          echo "Dispatching next discovery slice for $source_id"
          gh workflow run regulatory-monitor.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f source_id="$source_id" \
            -f test_notification=false
