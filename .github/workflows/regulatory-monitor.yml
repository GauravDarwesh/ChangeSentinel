name: Regulatory Monitor

on:
  # Monitoring is deliberately decoupled from code pushes. CI validates pushes;
  # this workflow is only for scheduled/manual production scans.
  workflow_dispatch:
    inputs:
      source_id:
        description: Source to monitor (all = every configured source)
        required: false
        default: all
        type: string
      test_notification:
        description: Send controlled ntfy delivery test without changing monitoring state
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *"

# One logical monitoring chain at a time.
# "queue: max" is important: with the default queue mode GitHub cancels an
# older pending run whenever a newer run enters the same concurrency group.
# Continuation runs must never disappear while the current slice is running.
#
# IMPORTANT: do not gate scheduled runs on persisted PAUSED state. PAUSED is a
# durable checkpoint, not proof that another run is active. A scheduled/manual
# run is itself able to resume that checkpoint. Skipping it would strand the
# crawl forever unless a separate continuation dispatch happened first.
concurrency:
  group: regulatory-monitor
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REGMON_SOURCE: ${{ inputs.source_id || 'all' }}
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # CI validates code changes and pull requests. Keep per-scan work focused on monitoring.
      - name: Selected source URL preflight
        run: |
          python - <<'PY'
          import os
          import requests
          from pathlib import Path
          from urllib.parse import urljoin

          from regmon.config import SourceConfig
          from regmon.discovery import in_scope
          from regmon.security import REDIRECT_STATUSES, validate_public_http_url

          requested = os.environ.get("REGMON_SOURCE", "all").strip()
          import json
          config = json.loads(Path("config/sources.json").read_text(encoding="utf-8"))
          sources = [
              SourceConfig.from_dict(source)
              for source in config.get("sources", [])
              if source.get("active", False)
              and (requested in {"all", "*"} or source.get("id") == requested)
          ]
          if not sources:
              raise SystemExit(f"No active seed URLs configured for source selection: {requested}")

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (compatible; ChangeSentinel/0.5; "
                  "+https://github.com/GauravDarwesh/ChangeSentinel)"
              )
          }
          reachable = 0
          total = sum(len(source.seed_urls) for source in sources)
          for source in sources:
              for url in source.seed_urls:
                  try:
                      current_url = url
                      visited = {current_url}
                      validate_public_http_url(current_url, resolve_dns=True)
                      response = None
                      for redirect_count in range(6):
                          if not in_scope(current_url, source):
                              raise ValueError(
                                  f"Target is outside configured monitor scope: {current_url}"
                              )
                          response = requests.get(
                              current_url,
                              timeout=30,
                              headers=headers,
                              allow_redirects=False,
                          )
                          if response.status_code not in REDIRECT_STATUSES:
                              break
                          location = response.headers.get("location")
                          if not location:
                              raise ValueError(
                                  f"Redirect from {current_url} did not include a Location header"
                              )
                          target = urljoin(current_url, location)
                          validate_public_http_url(target, resolve_dns=True)
                          if not in_scope(target, source):
                              raise ValueError(
                                  f"Redirect target is outside configured monitor scope: {target}"
                              )
                          if target in visited:
                              raise ValueError(f"Redirect loop detected at {target}")
                          if redirect_count >= 5:
                              raise ValueError("Exceeded 5 redirects during preflight")
                          visited.add(target)
                          current_url = target

                      if response is None:
                          raise RuntimeError("No response received during preflight")
                      print(
                          url,
                          "final_url=", current_url,
                          "status=", response.status_code,
                          "type=", response.headers.get("content-type"),
                      )
                      if response.status_code < 400:
                          reachable += 1
                  except Exception as exc:
                      print(url, "ERROR", type(exc).__name__, exc)

          print(f"reachable_seed_urls={reachable}/{total}")
          if reachable == 0:
              raise SystemExit(
                  "No selected source seed URL was reachable within its configured scope."
              )
          PY

      - name: Run monitoring engine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m regmon.monitor --source "$REGMON_SOURCE"

      - name: Validate monitoring state
        id: crawl-status
        run: python -m regmon.validate_state --source "$REGMON_SOURCE" --data-dir data --config config/sources.json --github-output "$GITHUB_OUTPUT"

      - name: Publish notifications
        if: ${{ steps.crawl-status.outputs.paused != 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REQUIRE_NTFY: "0"
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
        run: python -m regmon.notify

      - name: Controlled notification test
        if: ${{ inputs.test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REQUIRE_NTFY: "1"
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
        run: python -m regmon.notify --test

      - name: Commit monitoring state
        run: |
          set -euo pipefail
          git config user.name "regulatory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            echo "No monitoring data changes to commit."
            exit 0
          fi

          git commit -m "Update regulatory monitoring state"

          # A human/code push can happen while the long crawl is running.
          # The monitor only creates a data-only state commit after checkout.
          # If remote main advanced, rebase that state commit onto the newer main
          # and retry. If the histories are unrelated, refuse to publish.
          for attempt in 1 2 3; do
            git fetch origin main --quiet

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Remote main is an ancestor of the state commit; pushing state."
              git push origin HEAD:main
              exit 0
            fi

            if ! git merge-base HEAD origin/main >/dev/null; then
              echo "Remote main has no common ancestor with the state commit; refusing to publish."
              exit 1
            fi

            echo "Remote main advanced while the state commit was being built; rebasing state commit."
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "State commit could not be rebased cleanly; refusing to publish."
              exit 1
            fi
            sleep 3
          done

          echo "Could not publish monitoring state after retries."
          exit 1

      - name: Continue paused crawl
        if: ${{ steps.crawl-status.outputs.paused == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_ids="${{ steps.crawl-status.outputs.paused_sources }}"
          test -n "$source_ids"
          IFS=',' read -r -a paused_ids <<< "$source_ids"
          for source_id in "${paused_ids[@]}"; do
            test -n "$source_id"
            echo "Dispatching next discovery slice for $source_id"
            gh workflow run regulatory-monitor.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f source_id="$source_id" \
              -f test_notification=false
          done
