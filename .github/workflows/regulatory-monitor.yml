name: EBA Regulatory Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl a small real EBA section
        run: |
          mkdir -p data
          stealth-crawler crawl             "https://www.eba.europa.eu/activities/single-rulebook/regulatory-activities/consumer-protection/guidelines-product-oversight-and-governance-arrangements-retail-banking-products?phase=consolidated"             --base "https://www.eba.europa.eu/activities/single-rulebook/regulatory-activities/consumer-protection/"             --urls-only             > data/eba-urls.txt

      - name: Show discovered URLs
        run: |
          echo "Discovered URLs:"
          cat data/eba-urls.txt
          echo
          echo "Count:"
          wc -l data/eba-urls.txt

      - name: Save crawl output
        run: |
          git config user.name "regulatory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Save EBA crawl output"
          git push
