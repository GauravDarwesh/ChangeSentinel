name: Regulatory Monitor

on:
  push:
    branches: [main]
    paths:
      - "regmon/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/regulatory-monitor.yml"
  workflow_dispatch:
    inputs:
      source_id:
        description: Source to monitor (all = every configured source)
        required: false
        default: all
        type: string
      test_notification:
        description: Send controlled ntfy delivery test without changing monitoring state
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *" # scheduled regulatory scan

# Full-site baseline/monitor validation trigger.
concurrency:
  group: regulatory-monitor
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REGMON_SOURCE: ${{ inputs.source_id || 'all' }}
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Compile Python
        run: python -m compileall -q regmon

      - name: EBA discovery seed smoke test
        run: |
          python - <<'PY'
          import requests
          urls = [
              "https://www.eba.europa.eu/",
              "https://www.eba.europa.eu/homepage",
          ]
          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (compatible; ChangeSentinel/0.3; "
                  "+https://github.com/GauravDarwesh/ChangeSentinel)"
              )
          }
          reachable = 0
          for url in urls:
              try:
                  r = requests.get(url, timeout=30, headers=headers)
                  print(url, "status=", r.status_code, "type=", r.headers.get("content-type"))
                  if r.status_code < 400:
                      reachable += 1
              except Exception as exc:
                  print(url, "ERROR", type(exc).__name__, exc)
          if reachable == 0:
              raise SystemExit("No EBA discovery seed was reachable")
          PY

      - name: Run monitoring engine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m regmon.monitor --source "$REGMON_SOURCE"

      - name: Determine crawl status
        id: crawl-status
        run: |
          result="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          requested = os.environ.get("REGMON_SOURCE", "all")
          paused = []
          for path in sorted((Path("data") / "discovery").glob("*.json")):
              if path.name.endswith("-checkpoint.json"):
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if payload.get("state") == "PAUSED":
                  paused.append(str(payload.get("source_id") or path.stem))

          if requested not in {"all", "*"}:
              paused = [sid for sid in paused if sid == requested]

          print(("true" if paused else "false") + "|" + (paused[0] if paused else ""))
          PY
          )"
          IFS="|" read -r paused paused_source <<< "$result"
          echo "paused=$paused" >> "$GITHUB_OUTPUT"
          echo "paused_source=$paused_source" >> "$GITHUB_OUTPUT"
          echo "Crawl paused: $paused_source" >&2
      - name: Publish notifications
        if: ${{ steps.crawl-status.outputs.paused != 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'RegMonitoringWebCrawlerNTFY' }}
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
        run: python -m regmon.notify

      - name: Controlled notification test
        if: ${{ inputs.test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'RegMonitoringWebCrawlerNTFY' }}
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
        run: python -m regmon.notify --test

      - name: Commit monitoring state
        run: |
          git fetch origin main --quiet
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Stale monitoring runner detected; refusing to publish state."
            exit 1
          fi
          git config user.name "regulatory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update regulatory monitoring state"
          git push
      - name: Continue paused crawl
        if: ${{ steps.crawl-status.outputs.paused == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_id="${{ steps.crawl-status.outputs.paused_source }}"
          test -n "$source_id"
          echo "Dispatching next discovery slice for $source_id"
          gh workflow run regulatory-monitor.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f source_id="$source_id" \
            -f test_notification=false
