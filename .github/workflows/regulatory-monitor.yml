name: EBA Regulatory Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Stealth Crawler
        run: stealth-crawler crawl https://www.eba.europa.eu/ --urls-only
      - name: Save crawl output
        run: |
          mkdir -p data
          stealth-crawler crawl https://www.eba.europa.eu/ --urls-only > data/eba-urls.txt 2>&1 || true
          git config user.name "regulatory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Save EBA crawl output"
          git push
