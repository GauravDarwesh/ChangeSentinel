name: Regulatory Monitor

on:
  # Monitoring is deliberately decoupled from code pushes. CI validates pushes;
  # this workflow is only for scheduled/manual production scans.
  workflow_dispatch:
    inputs:
      source_id:
        description: Source to monitor (all = every configured source)
        required: false
        default: all
        type: string
      allow_mass_removal:
        description: Source ID whose held mass removal you have confirmed (leave empty normally)
        required: false
        default: ""
        type: string
      test_notification:
        description: Send controlled ntfy delivery test without changing monitoring state
        required: false
        default: false
        type: boolean
      due_only:
        description: With source "all", scan only monitors that are due by their scan schedule (never-scanned monitors are always due)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *"

# Serialize production scans and state commits. Keep at most one pending run rather than
# building an unbounded queue when scheduled/manual triggers overlap.
concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      REGMON_SOURCE: ${{ inputs.source_id || 'all' }}
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout current main after concurrency queueing
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Workflow runs may wait in the concurrency queue while another scan
          # commits state. Check out the current durable main, not the event's
          # possibly stale GITHUB_SHA pinned before the queued run began.
          ref: main
          fetch-depth: 1
          # The scan parses untrusted PDFs/HTML with third-party libraries; do not
          # leave a write-scoped token in .git/config while it runs. Only the
          # commit steps receive the token, through GH_TOKEN.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache Docling model artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/docling
            ~/.cache/huggingface
          key: docling-models-v2.140.0-${{ runner.os }}-py313-layout-table-v1

      - name: Install dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      # CI validates code changes and pull requests. Keep per-scan work focused on monitoring.
      - name: Selected source URL preflight
        run: |
          python - <<'PY'
          import os
          import requests
          from pathlib import Path
          from urllib.parse import urljoin

          from regmon.config import SourceConfig
          from regmon.discovery import in_scope, _redirect_key
          from regmon.safe_http import public_destinations_only
          from regmon.security import REDIRECT_STATUSES, USER_AGENT, validate_public_http_url

          requested = os.environ.get("REGMON_SOURCE", "all").strip()
          import json
          config = json.loads(Path("config/sources.json").read_text(encoding="utf-8"))
          sources = [
              SourceConfig.from_dict(source)
              for source in config.get("sources", [])
              if source.get("active", False)
              and (requested in {"all", "*"} or source.get("id") == requested)
          ]
          if not sources:
              raise SystemExit(f"No active seed URLs configured for source selection: {requested}")

          headers = {"User-Agent": USER_AGENT}
          reachable = 0
          total = sum(len(source.seed_urls) for source in sources)
          for source in sources:
              for url in source.seed_urls:
                  try:
                      current_url = url
                      visited = {_redirect_key(current_url)}
                      validate_public_http_url(current_url, resolve_dns=True)
                      response = None
                      for redirect_count in range(6):
                          if not in_scope(current_url, source):
                              raise ValueError(
                                  f"Target is outside configured monitor scope: {current_url}"
                              )
                          with public_destinations_only():
                              response = requests.get(
                                  current_url,
                                  timeout=30,
                                  headers=headers,
                                  allow_redirects=False,
                              )
                          if response.status_code not in REDIRECT_STATUSES:
                              break
                          location = response.headers.get("location")
                          if not location:
                              raise ValueError(
                                  f"Redirect from {current_url} did not include a Location header"
                              )
                          target = urljoin(current_url, location)
                          validate_public_http_url(target, resolve_dns=True)
                          if not in_scope(target, source):
                              raise ValueError(
                                  f"Redirect target is outside configured monitor scope: {target}"
                              )
                          target_key = _redirect_key(target)
                          if target_key in visited:
                              raise ValueError(f"Redirect loop detected at {target}")
                          if redirect_count >= 5:
                              raise ValueError("Exceeded 5 redirects during preflight")
                          visited.add(target_key)
                          current_url = target

                      if response is None:
                          raise RuntimeError("No response received during preflight")
                      print(
                          url,
                          "final_url=", current_url,
                          "status=", response.status_code,
                          "type=", response.headers.get("content-type"),
                      )
                      if response.status_code < 400:
                          reachable += 1
                  except Exception as exc:
                      print(url, "ERROR", type(exc).__name__, exc)

          print(f"reachable_seed_urls={reachable}/{total}")
          if reachable == 0:
              raise SystemExit(
                  "No selected source seed URL was reachable within its configured scope."
              )
          PY

      - name: Ensure OCR fallback is available
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          tesseract --version | head -n 1

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run monitoring engine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REGMON_ALLOW_MASS_REMOVAL: ${{ inputs.allow_mass_removal || '' }}
          # Scheduled runs scan only the monitors their cadence makes due
          # (regmon/schedule.py); a manual run scans everything it names unless
          # it asks for due_only (the scan a registration starts does, so new
          # monitors get their first baseline without a full-fleet scan).
          REGMON_DUE_ONLY: ${{ (github.event_name == 'schedule' || inputs.due_only == true) && '--due-only' || '' }}
        run: python -u -m regmon.monitor --source "$REGMON_SOURCE" $REGMON_DUE_ONLY

      - name: Validate monitoring state
        id: crawl-status
        run: python -m regmon.validate_state --source "$REGMON_SOURCE" --data-dir data --config config/sources.json --github-output "$GITHUB_OUTPUT"

      # Scheduled digests (config/digests.json) whose time has passed are written to
      # data/digests/ and queued with this run's alerts. Never fails the run.
      - name: Build due digests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m regmon.digest --due

      # Queue notification candidates before the state commit, including when discovery
      # is paused, so valid events from completed sources are not lost.
      - name: Queue notifications
        run: python -m regmon.notify --enqueue-only

      # Commit generated state before anything is delivered. If the commit cannot
      # be published, nothing has been sent, so the next run re-detects the same
      # events without duplicate deliveries.
      - name: Commit monitoring state
        id: state-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "regulatory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/commit_state.sh "Update regulatory monitoring state" "${{ steps.base.outputs.sha }}"

      - name: Publish notifications
        id: delivery
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REQUIRE_NTFY: "0"
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
          # Optional extra channels; each is enabled by setting its secret.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python -m regmon.notify --deliver-only

      - name: Commit notification delivery state
        id: delivery-commit
        if: ${{ always() && steps.state-commit.outcome == 'success' && steps.delivery.outputs.base != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/commit_state.sh "Record notification deliveries" "${{ steps.delivery.outputs.base }}"

      - name: Controlled notification test
        if: ${{ inputs.test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REQUIRE_NTFY: "1"
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
        run: python -m regmon.notify --test

      - name: Publish latest monitoring data to Pages
        if: ${{ steps.state-commit.outputs.committed == 'true' || steps.delivery-commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Workflow commits created with GITHUB_TOKEN do not trigger the normal push
          # workflow chain, so explicitly publish the updated JSON data files.
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

      - name: Report paused crawl without auto-dispatching another run
        if: ${{ steps.crawl-status.outputs.paused == 'true' }}
        run: |
          echo "Discovery is paused for: ${{ steps.crawl-status.outputs.paused_sources }}"
          echo "Automatic continuation is disabled to prevent repeated non-progressing runs."
          echo "Inspect the durable checkpoint and resume manually after resolving the crawl condition."

      # Optional out-of-band liveness signal (for example a healthchecks.io check
      # that alerts when no ping arrives for 14 hours). This also catches runs that
      # never start, which no in-workflow step can report.
      - name: Heartbeat ping
        if: ${{ success() }}
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -n "${HEALTHCHECK_PING_URL:-}" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_PING_URL" > /dev/null && echo "Heartbeat sent."
          else
            echo "HEALTHCHECK_PING_URL is not configured; skipping heartbeat."
          fi

      # A failed scan must never be silent. Uses curl only, so it works even when
      # dependency installation was the step that failed.
      - name: Alert on workflow failure
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC is not configured; cannot send the failure alert."
            exit 0
          fi
          curl -fsS -m 20 --retry 3 \
            -H "Title: Regulatory Monitor run failed" \
            -H "Priority: 4" \
            -H "Tags: rotating_light,monitoring" \
            -H "Click: $RUN_URL" \
            -d "Monitoring run ${{ github.run_number }} for source '${REGMON_SOURCE}' failed. Changes may not be detected until it is fixed. Logs: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null && echo "Failure alert sent."
