name: EBA Regulatory Monitor

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test*.py"

      - name: HTTP smoke test
        run: |
          python - <<'PY'
          import requests
          response = requests.get(
              "https://www.eba.europa.eu/",
              timeout=30,
              headers={"User-Agent": "regulatory-monitoring-poc/1.2"},
          )
          print("EBA HTTP status:", response.status_code)
          print("EBA content-type:", response.headers.get("content-type"))
          print("EBA body bytes:", len(response.content))
          PY

      - name: Run monitoring pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m regmon.monitor

      - name: Show report
        run: cat data/report.md

      - name: Publish ntfy notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'RegMonitoringWebCrawlerNTFY' }}
          NTFY_SERVER: https://ntfy.sh
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m regmon.notify

      - name: Save monitoring state
        run: |
          git config user.name "regulatory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update EBA monitoring state"
          git push

  dashboard:
    needs: monitor
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Prepare dashboard site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R dashboard/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
