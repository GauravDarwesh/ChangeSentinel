name: One-time HTML snapshot bootstrap

on:
  push:
    branches: [main]
    paths:
      - "bootstrap-html-snapshot.trigger"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture the existing HTML baselines
        run: python -u -m regmon.monitor --source fed-reporting-forms-pilot
      - name: Verify HTML snapshots were saved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          inventory = payload.get("sources", {}).get("fed-reporting-forms-pilot", {})
          html_items = [item for item in inventory.values() if item.get("html_snapshot_location")]
          for item in html_items:
              path = Path(item["html_snapshot_location"])
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty HTML snapshot: {path}")
              print(f"saved {item['canonical_url']} -> {path} ({path.stat().st_size} bytes)")
          if len(html_items) < 2:
              raise SystemExit(f"Expected HTML snapshots for both pilot URLs; saved {len(html_items)}")
          PY
      - name: Commit snapshot baseline
        run: |
          set -euo pipefail
          git config user.name "regulatory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Capture initial Federal Reserve HTML snapshots"
          git fetch origin main --quiet
          git rebase origin/main
          git push origin HEAD:main
