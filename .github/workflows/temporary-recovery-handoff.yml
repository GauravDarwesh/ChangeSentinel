name: One-time ChangeSentinel Recovery Handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-recovery-handoff.yml"

permissions:
  actions: write
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: "39096226256"
    steps:
      - name: Stop stale recovery run before it publishes
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel" || true

          status=""
          for attempt in $(seq 1 60); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq '.status + ":" + (.conclusion // "")')"
            echo "target_run=${status}"
            if [[ "${status}" == completed:* ]]; then
              break
            fi
            sleep 2
          done

          if [[ "${status}" != completed:* ]]; then
            echo "Timed out waiting for the stale recovery run to stop."
            exit 1
          fi

      - name: Start recovery with the corrected main branch
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run regulatory-monitor.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_id=all \
            -f test_notification=false
          echo "Dispatched Regulatory Monitor from current main."
