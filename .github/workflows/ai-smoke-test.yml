name: AI Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "regmon/engine.py"
      - "regmon/change.py"
      - "regmon/content.py"
      - "regmon/ai.py"
      - "scripts/ai_eval.py"
      - "scripts/ai_eval_cases.json"
      - ".github/workflows/ai-smoke-test.yml"
  push:
    branches:
      - main
    paths:
      - "regmon/engine.py"
      - "regmon/change.py"
      - "regmon/content.py"
      - "regmon/ai.py"
      - "scripts/ai_eval.py"
      - "scripts/ai_eval_cases.json"
      - ".github/workflows/ai-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    # Repository secrets are available to same-repository PRs, not fork PRs.
    # Fork contributions still run the normal non-secret CI suite.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Call configured AI model with synthetic evidence
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_TIMEOUT_SECONDS: "60"
          AI_ATTEMPTS: "2"
        run: python -m regmon.ai --smoke-test

      # Runs manually or on relevant main-branch changes. Scores end-to-end decisions:
      # deterministic extraction-drift suppression first,
      # then semantic AI for source changes. Emits all case-level decisions and accuracy.
      - name: Score end-to-end relevance on the evaluation set
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Keep the expanded 12-case model evaluation within the job's time budget.
          AI_TIMEOUT_SECONDS: "45"
          AI_ATTEMPTS: "1"
        run: python scripts/ai_eval.py --min-accuracy 0.8 --min-model-accuracy 0.8
