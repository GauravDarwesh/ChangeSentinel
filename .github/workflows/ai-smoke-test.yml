name: AI Smoke Test

on:
  workflow_dispatch:
  # Always emit a smoke-test status on PRs so branch rules can require this
  # check consistently. Expensive provider calls are gated by changed paths below.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "regmon/engine.py"
      - "regmon/change.py"
      - "regmon/content.py"
      - "regmon/ai.py"
      - "scripts/ai_eval.py"
      - "scripts/ai_eval_cases.json"
      - ".github/workflows/ai-smoke-test.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    # Repository secrets are available to same-repository PRs, not fork PRs.
    # Fork contributions still run the normal non-secret CI suite.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Check whether this PR changes AI-relevant files
        id: ai-scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          if grep -Eq '^(regmon/(engine|change|content|ai)\.py|scripts/ai_eval\.py|scripts/ai_eval_cases\.json|\.github/workflows/ai-smoke-test\.yml)$' <<< "$changed_files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "AI-relevant files changed; full AI regression gate will run."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No AI-relevant source/evaluator changes; model calls are skipped but the workflow check remains available."
          fi

      - name: Call configured AI model with synthetic evidence
        if: ${{ github.event_name != 'pull_request' || steps.ai-scope.outputs.relevant == 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_TIMEOUT_SECONDS: "60"
          AI_ATTEMPTS: "2"
        run: python -m regmon.ai --smoke-test

      # Each of the 12 model-routed fixtures is evaluated twice; invalid provider
      # responses can retry once. Keep the free route as the default.
      - name: Score end-to-end relevance and free-router stability
        if: ${{ github.event_name != 'pull_request' || steps.ai-scope.outputs.relevant == 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_TIMEOUT_SECONDS: "20"
          AI_ATTEMPTS: "2"
          AI_EVAL_REPEATS: "2"
        run: python scripts/ai_eval.py --min-accuracy 0.8 --min-model-accuracy 0.8 --min-model-agreement 0.8 --repeats 2
