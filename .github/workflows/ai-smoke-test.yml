name: AI Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Call configured AI model with synthetic evidence
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_TIMEOUT_SECONDS: "60"
          AI_ATTEMPTS: "2"
        run: python -m regmon.ai --smoke-test
