name: Temporary Dashboard Verification

on:
  push:
    branches:
      - fix/normalized-content-change-detection

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python tests
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Python compile
        run: python -m compileall -q regmon

      - name: Dashboard structure
        run: |
          test -f dashboard/index.html
          grep -q 'RAW_BASE' dashboard/index.html
          grep -q 'Live state connected' dashboard/index.html
          grep -q 'setInterval(load, 15000)' dashboard/index.html
          grep -q 'eventSearch' dashboard/index.html
          grep -q 'inventorySearch' dashboard/index.html

      - name: Dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("dashboard/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No inline dashboard script found"
          Path("/tmp/dashboard.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/dashboard.js

      - name: Pages package smoke test
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R dashboard/. _site/
          test -f _site/index.html
          test ! -e _site/data/report.json
