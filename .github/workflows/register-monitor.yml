name: Register Dashboard Monitor

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

# A repository-wide concurrency group keeps only one pending run. During a bulk upload,
# later issue events replace earlier pending runs, silently dropping valid monitor requests.
# Scope the group to one issue; distinct issue registrations reconcile concurrent main pushes below.
concurrency:
  group: register-dashboard-monitor-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  register:
    if: ${{ github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[ChangeSentinel] Add monitor') || startsWith(github.event.issue.title, '[ChangeSentinel] Delete monitor')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # Registration only imports BeautifulSoup and standard-library modules.
      # Avoid installing the heavyweight document-processing stack in this job.
      - name: Install registration dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.14.3 requests==2.34.2

      - name: Preflight registration imports
        run: python -c "from bs4 import BeautifulSoup; from regmon.register_monitor import register_request; from regmon.scout.profiles import load_config; print('Monitor and Scout registration imports OK')"

      - name: Register URL and commit source configuration
        id: register
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "changesentinel-bot"
          git config user.email "actions@users.noreply.github.com"
          success=false
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main --quiet
            git checkout -B main origin/main
            python -m regmon.register_monitor \
              --event "$GITHUB_EVENT_PATH" \
              --config config/sources.json \
              --scout-config config/scout.json \
              --output "$RUNNER_TEMP/monitor-registration.json"
            SOURCE_IDS="$(python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")); print(";".join(d.get("source_ids") or [d["source_id"]]))')"
            URL="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json"))["url"])')"
            CREATED="$(python -c 'import json,os; print(str(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json"))["created"]).lower())')"
            DEPTH_UPDATED="$(python -c 'import json,os; print(str(bool(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("crawl_depth_updated", False))).lower())')"
            DELETED="$(python -c 'import json,os; print(str(bool(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("deleted", False))).lower())')"
            SCOUT_ENABLED="$(python -c 'import json,os; print(str(bool(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("scout_enabled", False))).lower())')"
            SCOUT_CHANNEL_ID="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("scout_channel_id", ""))')"
            SCOUT_REGULATOR_ID="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("scout_regulator_id", ""))')"
            CRAWL_DEPTH="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("crawl_depth", 0))')"
            BULK="$(python -c 'import json,os; print(str(bool(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("bulk", False))).lower())')"
            COUNT="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("count", 1))')"
            CREATED_COUNT="$(python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")); print(d.get("created_count", int(d["created"])))')"
            EXISTING_COUNT="$(python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")); print(d.get("existing_count", int(not d["created"])))')"
            REDIRECTED="$(python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")); print(sum(1 for i in (d.get("items") or [d]) if i.get("redirected_from")))')"
            DISCOVERY_ONLY="$(python -c 'import json,os; print(str(bool(json.load(open(os.environ["RUNNER_TEMP"] + "/monitor-registration.json")).get("discovery_only", False))).lower())')"
            if git diff --quiet -- config/sources.json config/scout.json; then
              echo "All requested monitor and Scout settings are already configured."
              success=true
              break
            fi
            git add config/sources.json config/scout.json
            if [ "$DISCOVERY_ONLY" = "true" ]; then
              git commit -m "Register Scout link discovery (no monitor added)"
            elif [ "$BULK" = "true" ]; then
              git commit -m "Register manually requested monitor batch ($COUNT links)"
            elif [ "$SCOUT_ENABLED" = "true" ]; then
              git commit -m "Register monitor and weekly Scout discovery"
            else
              git commit -m "Register manually requested monitor $(printf '%s' "$SOURCE_IDS" | cut -d';' -f1)"
            fi
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "Push attempt $attempt did not publish; refreshing main and retrying."
            # Different issue events now run independently. Back off with small jitter so
            # concurrent registrations do not repeatedly collide on the same main commit.
            sleep $((attempt * 2 + RANDOM % 3))
          done
          if [ "$success" != true ]; then
            echo "Could not publish monitor configuration after six attempts."
            exit 1
          fi
          echo "source_ids=$SOURCE_IDS" >> "$GITHUB_OUTPUT"
          echo "monitor_url=$URL" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "crawl_depth_updated=$DEPTH_UPDATED" >> "$GITHUB_OUTPUT"
          echo "deleted=$DELETED" >> "$GITHUB_OUTPUT"
          echo "scout_enabled=$SCOUT_ENABLED" >> "$GITHUB_OUTPUT"
          echo "scout_channel_id=$SCOUT_CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "scout_regulator_id=$SCOUT_REGULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "crawl_depth=$CRAWL_DEPTH" >> "$GITHUB_OUTPUT"
          echo "bulk=$BULK" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "created_count=$CREATED_COUNT" >> "$GITHUB_OUTPUT"
          echo "existing_count=$EXISTING_COUNT" >> "$GITHUB_OUTPUT"
          echo "discovery_only=$DISCOVERY_ONLY" >> "$GITHUB_OUTPUT"
          echo "redirected=$REDIRECTED" >> "$GITHUB_OUTPUT"

      - name: Publish updated source configuration to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The registration commit uses GITHUB_TOKEN; explicitly refresh the Pages
          # artifact so the current source configuration is available immediately.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Start first monitoring scan
        if: steps.register.outputs.deleted != 'true' && steps.register.outputs.discovery_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_IDS: ${{ steps.register.outputs.source_ids }}
        run: |
          set -euo pipefail
          # Start exactly one scan. Scans share one concurrency queue that holds a
          # single waiting run, so one dispatch per source made GitHub cancel all
          # but the first and last. A batch is scanned together in one "all" run
          # (every new source gets its quiet first baseline there).
          IFS=';' read -r -a source_id_list <<< "$SOURCE_IDS"
          ids=()
          for SOURCE_ID in "${source_id_list[@]}"; do
            [ -n "$SOURCE_ID" ] && ids+=("$SOURCE_ID")
          done
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "No source to scan."
            exit 0
          fi
          TARGET="${ids[0]}"
          if [ "${#ids[@]}" -gt 1 ]; then TARGET="all"; fi
          # An "all" run here only needs the new monitors (never scanned, so
          # always due); due_only leaves the rest of the fleet to its schedule.
          # Without it, each 25-link import batch forced a full-fleet scan.
          gh workflow run regulatory-monitor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_id="$TARGET" \
            -f test_notification=false \
            -f due_only=true

      - name: Start initial Scout discovery baseline
        if: steps.register.outputs.scout_enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SCOUT_REGULATOR: ${{ steps.register.outputs.scout_regulator_id }}
        run: |
          set -euo pipefail
          gh workflow run scout.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f regulator="$SCOUT_REGULATOR"

      - name: Confirm registration on the request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_IDS: ${{ steps.register.outputs.source_ids }}
          MONITOR_URL: ${{ steps.register.outputs.monitor_url }}
          CREATED: ${{ steps.register.outputs.created }}
          DEPTH_UPDATED: ${{ steps.register.outputs.crawl_depth_updated }}
          BULK: ${{ steps.register.outputs.bulk }}
          COUNT: ${{ steps.register.outputs.count }}
          CREATED_COUNT: ${{ steps.register.outputs.created_count }}
          EXISTING_COUNT: ${{ steps.register.outputs.existing_count }}
          DELETED: ${{ steps.register.outputs.deleted }}
          SCOUT_ENABLED: ${{ steps.register.outputs.scout_enabled }}
          CRAWL_DEPTH: ${{ steps.register.outputs.crawl_depth }}
          SCOUT_REGULATOR_ID: ${{ steps.register.outputs.scout_regulator_id }}
          DISCOVERY_ONLY: ${{ steps.register.outputs.discovery_only }}
          REDIRECTED: ${{ steps.register.outputs.redirected }}
        run: |
          set -euo pipefail
          if [ "$DISCOVERY_ONLY" = "true" ]; then
            message="Saved link discovery for $MONITOR_URL through link depth $CRAWL_DEPTH (Scout profile $SCOUT_REGULATOR_ID). No monitor was added. A first discovery sweep has been queued; when it finishes, open Discover in the dashboard to pick the links to monitor. Only links you select and submit become monitors."
          elif [ "$DELETED" = "true" ]; then
            message="Stopped monitoring $MONITOR_URL in source ${SOURCE_IDS%%;*}. Future scans will exclude this URL; existing reports and saved evidence were retained."
          elif [ "$BULK" = "true" ]; then
            message="Bulk registration processed $COUNT unique links: $CREATED_COUNT new monitors and $EXISTING_COUNT already configured. One monitoring scan of all sources has been queued; it takes the first saved copy of each new link."
          elif [ "$DEPTH_UPDATED" = "true" ]; then
            SOURCE_ID="${SOURCE_IDS%%;*}"
            message="Updated the existing monitor $MONITOR_URL (source $SOURCE_ID) to crawl depth $CRAWL_DEPTH. Its source ID and saved history were retained, and the first monitoring scan has been queued."
          elif [ "$CREATED" = "true" ]; then
            SOURCE_ID="${SOURCE_IDS%%;*}"
            message="Registered $MONITOR_URL as source $SOURCE_ID in config/sources.json. The first monitoring scan has been queued."
          else
            SOURCE_ID="${SOURCE_IDS%%;*}"
            message="$MONITOR_URL is already configured under source $SOURCE_ID. A monitoring scan has been queued."
          fi
          if [ "${REDIRECTED:-0}" != "0" ]; then
            message="$message $REDIRECTED address(es) redirected elsewhere, so the final address was registered instead (see config/sources.json)."
          fi
          if [ "$SCOUT_ENABLED" = "true" ] && [ "$DISCOVERY_ONLY" != "true" ]; then
            message="$message Weekly Scout discovery is enabled through link depth $CRAWL_DEPTH (profile $SCOUT_REGULATOR_ID). Newly discovered or replacement document URLs will appear in Scout for review; they are not silently added as monitors."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$message"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Explain registration failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Automatic registration failed. Check the Register Dashboard Monitor run logs for the failing step. The workflow now checks its Python imports before registration; only correct the URL if logs identify it as invalid. Only the repository owner can register URLs."
