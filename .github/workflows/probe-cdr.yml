name: Probe CDR taxonomy (temporary)
on:
  push:
    branches: [probe/cdr-taxonomy]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python -u scripts/probe_cdr.py
