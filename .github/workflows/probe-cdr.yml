name: Probe CDR taxonomy (temporary)
on:
  push:
    branches: [probe/cdr-taxonomy]
    paths: [scripts/probe_cdr.py, .github/workflows/probe-cdr.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -u scripts/probe_cdr.py > probe-output.txt 2>&1 || true
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-output.txt && git commit -m "Probe output" && git push
