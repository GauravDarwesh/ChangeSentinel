name: RegMonitor CI

on:
  pull_request:
  push:
    branches: [main]
    # Monitoring state is data-only; it does not require a source-code test run.
    paths-ignore:
      - "data/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Cache Docling model artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/docling
            ~/.cache/huggingface
          key: docling-models-v2.140.0-${{ runner.os }}-py313-layout-table-v1
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt reportlab==4.4.4
      - run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Exercise real Docling table reconstruction on a synthetic PDF
        run: python scripts/docling_integration_smoke.py
      - name: Validate active-source state against committed history
        run: python -m regmon.validate_state --source all --data-dir data --config config/sources.json
      - run: python -m compileall -q regmon
      - name: Dashboard JavaScript syntax checks
        run: |
          node -e "const fs=require('fs'); for (const f of ['dashboard.js']) { const s=fs.readFileSync(f,'utf8'); new Function(s); console.log(f + ' syntax OK'); } const h=fs.readFileSync('index.html','utf8'); if (!h.includes('src=\"dashboard.js')) throw new Error('dashboard JS reference missing');"
      - name: Install browser QA dependencies
        run: |
          python -m pip install playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Serve this branch's dashboard build for visual acceptance
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/changesentinel-dashboard.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/changesentinel-dashboard.log
          exit 1
      - name: Run visual acceptance against this branch
        env:
          CHANGESENTINEL_DASHBOARD_URL: http://127.0.0.1:8765/
        run: python scripts/visual_acceptance.py
      - name: Upload dashboard and PDF visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changesentinel-visual-acceptance
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
