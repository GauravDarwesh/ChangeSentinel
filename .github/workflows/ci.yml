name: RegMonitor CI

on:
  pull_request:
  push:
    branches: [main]
    # Monitoring state is data-only; it does not require a source-code test run.
    paths-ignore:
      - "data/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Validate active-source state against committed history
        run: python -m regmon.validate_state --source all --data-dir data --config config/sources.json
      - run: python -m compileall -q regmon
      - name: Dashboard JavaScript syntax checks
        run: |
          node -e "const fs=require('fs'); for (const f of ['dashboard.js']) { const s=fs.readFileSync(f,'utf8'); new Function(s); console.log(f + ' syntax OK'); } const h=fs.readFileSync('index.html','utf8'); if (!h.includes('src=\"dashboard.js')) throw new Error('dashboard JS reference missing');"
