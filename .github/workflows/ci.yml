name: RegMonitor CI

on:
  pull_request:
  push:
    branches: [main]
    # Monitoring state is data-only; it does not require a source-code test run.
    paths-ignore:
      - "data/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # Docling, the unittest suite and the golden corpus; a hang must not hold a
    # runner for the 6-hour default.
    timeout-minutes: 60
    env:
      # How long a cache restore (pip in setup-python, the Docling models) may
      # spend on one 128 MB segment; the default is 10 minutes. On PR #258 the
      # cache service refused the pip download ("Egress is over the account
      # limit") within a minute, but the action's leftover timer still held the
      # step for the full 10. A failed or abandoned restore is only a warning
      # and the job carries on without the cache, so this changes no outcome.
      # A healthy segment takes seconds; 3 minutes still allows ~0.7 MB/s.
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install OCR fallback used by the golden extraction corpus
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Cache Docling model artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/docling
            ~/.cache/huggingface
          key: docling-models-v2.140.0-${{ runner.os }}-py313-layout-table-v1
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt reportlab==4.4.4
      - run: python -m unittest discover -s tests -p "test*.py" -v
      # Exercise the existing Pydoll path and the SeleniumBase CDP fallback
      # against a simulated Cloudflare site (tests/challenge_site.py).
      # A skip here would mean no browser was found, so it fails the step.
      # `shell: bash` turns on pipefail: without it `| tee` hid every test
      # failure, which let a Pydoll 3 launch crash reach production (26 Oct 2026).
      - name: Real-browser bot-check paths (Pydoll + SeleniumBase CDP)
        shell: bash
        env:
          CHANGESENTINEL_BROWSER_TEST: "1"
        run: |
          set -o pipefail
          if ! python -m unittest discover -s tests -p "test_browser_fetch.py" -k real -v 2>&1 | tee browser-test.log; then
            # Put the failing tests and their tracebacks on the check run, so
            # they are readable from the checks API without the job log.
            python - <<'PY'
          import re
          log = open("browser-test.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n(?==+\n(?:FAIL|ERROR): )", log)
          failures = [b.strip("=\n") for b in blocks if re.match(r"=*\n?(FAIL|ERROR): ", b.lstrip("\n"))] or [log[-6000:]]
          outcomes = [line for line in log.splitlines() if re.search(r" \.\.\. (ok|FAIL|ERROR|skipped)", line)]
          print("::error title=Real-browser test outcomes::" + "%0A".join(line.replace("%", "%25") for line in outcomes))
          for block in failures[:8]:
              title = block.splitlines()[0][:200].replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
              body = "\n".join(block.splitlines()[-60:])[-6000:]
              print(f"::error title={title}::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
            exit 1
          fi
          if grep -q "skipped" browser-test.log; then echo "The real-browser tests were skipped"; exit 1; fi
      - name: Exercise real Docling table reconstruction on a synthetic PDF
        run: python scripts/docling_integration_smoke.py
      - name: Golden extraction corpus (saved originals reproduce their baselines)
        run: python scripts/golden_corpus_check.py
      - name: Validate active-source state against committed history
        run: python -m regmon.validate_state --source all --data-dir data --config config/sources.json
      - name: Validate the item registry and lineage map
        run: python -m regmon.registry check
      - run: python -m compileall -q regmon
      - name: Dashboard JavaScript syntax checks
        run: |
          node -e "const fs=require('fs'); for (const f of ['dashboard-lib.js','dashboard.js']) { const s=fs.readFileSync(f,'utf8'); new Function(s); console.log(f + ' syntax OK'); } const h=fs.readFileSync('index.html','utf8'); for (const ref of ['src=\"dashboard-lib.js','src=\"dashboard.js']) { if (!h.includes(ref)) throw new Error('index.html is missing ' + ref); }"

  # The Ask Sentinel Edge Function, type-checked and run against in-memory fakes
  # of Supabase and OpenRouter: quotas, network and service limits, refunds and the
  # wording of errors, without touching the deployed function or its budget.
  edge-function:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Deno
        run: npm install --no-save --no-package-lock deno@2.9.6
      - name: Type-check and test the Edge Function
        run: |
          npx deno check supabase/functions/ask-sentinel/index.ts
          npx deno test --allow-env supabase/functions/ask-sentinel/index_test.ts
          npx deno check supabase/functions/calendar-api/index.ts
          npx deno test --allow-env supabase/functions/calendar-api/index_test.ts
          npx deno check supabase/functions/page-reader/index.ts
          npx deno test --allow-env supabase/functions/page-reader/index_test.ts

  # A real browser run of the dashboard against this commit's data: every pinned
  # third-party script must load under its integrity hash, pdf.js must render a
  # saved PDF, each view must draw without a script error, and the phone layout
  # must not scroll sideways. Screenshots are kept for review.
  dashboard-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      # Health is written by scans; build it from this commit's committed state
      # (standard library only) so the Health view is exercised before the first
      # production scan that writes it.
      - name: Build fleet health from committed state
        run: test -f data/health.json || python3 -m regmon.health --data-dir data --config config/sources.json
      - name: Dashboard browser smoke test
        env:
          SMOKE_ARTIFACTS: smoke-artifacts
        run: node scripts/dashboard_smoke.mjs
      - name: Sentinel agent browser smoke test (dock, unlock, live dashboard, cursor, approvals)
        env:
          SMOKE_ARTIFACTS: smoke-artifacts
        run: node scripts/sentinel_smoke.mjs
      - name: Recorded browser steps (record on a test portal, replay with the engine's script)
        run: node scripts/browser_steps_check.mjs
      - name: Keep the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-smoke-screenshots
          path: smoke-artifacts
          retention-days: 14
          if-no-files-found: ignore
