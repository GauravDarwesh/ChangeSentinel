name: Temporary Integration Verification

on:
  push:
    branches:
      - fix/normalized-content-change-detection

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Compile Python
        run: python -m compileall -q regmon

      - name: Dashboard smoke test
        run: |
          test -f dashboard/index.html
          grep -q 'data/report.json' dashboard/index.html
          grep -q 'data/latest.json' dashboard/index.html
          grep -q '15s' dashboard/index.html
