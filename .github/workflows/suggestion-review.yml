name: Suggestion Decision

# Your checks → Suggested update → Approve or Reject opens a prefilled issue holding one
# JSON request. Only issues the repository owner opens are processed. The decision is
# recorded in data/reviews/suggestions.json (regmon/suggestions.py), outside the scan's
# state path, so a scan running meanwhile is unaffected. Nothing is ever applied to code.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  decision:
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[ChangeSentinel] Suggestion decision') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: change-review
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # Applying a decision uses only the Python standard library.
      - name: Record the decision and commit
        id: record
        run: |
          set -euo pipefail
          git config user.name "changesentinel-review"
          git config user.email "actions@users.noreply.github.com"
          success=false
          for attempt in 1 2 3; do
            git fetch origin main --quiet
            git checkout -B main origin/main
            python -m regmon.suggestions apply-issue --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/decision.json"
            if test -z "$(git status --porcelain -- data/reviews/suggestions.json)"; then
              success=true
              break
            fi
            git add -- data/reviews/suggestions.json
            git commit -m "Record suggested-update decision (issue #${{ github.event.issue.number }})"
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "Push attempt $attempt did not publish; refreshing main and retrying."
            sleep 2
          done
          if [ "$success" != true ]; then
            echo "Could not publish the decision after three attempts."
            exit 1
          fi
          echo "summary=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/decision.json"))["summary"])')" >> "$GITHUB_OUTPUT"

      - name: Publish to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Confirm on the request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.record.outputs.summary }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Recorded: $SUMMARY. The dashboard shows it after the next Pages deploy (about a minute). Nothing was applied to any code."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY"

      - name: Explain a rejected request
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Nothing was recorded. Open the workflow run for the reason: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
