name: Stop Broad EBA Recovery Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-stop-broad-run.yml"

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: "39101630586"
    steps:
      - name: Cancel broad EBA run and verify stopped
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel" || true
          for attempt in $(seq 1 50); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq '.status + ":" + (.conclusion // "")')"
            echo "target_run=${status}"
            if [[ "${status}" == completed:* ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for broad EBA run to stop."
          exit 1
