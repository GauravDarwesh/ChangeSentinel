name: Monitor Freshness Check

# Independent of the scan workflow: if scans stop committing (failures,
# cancellations, a disabled schedule), this raises an alert. It cannot fire when
# GitHub Actions itself refuses to start jobs (for example a billing block);
# configure HEALTHCHECK_PING_URL with an external service for that case.
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # Each monitor has its own cadence (regmon/schedule.py), so freshness is
      # judged per monitor: overdue once the slot it was due in passed 8 hours
      # ago. With the default six-hourly cadence that is 14 hours, as before.
      - name: Find monitors overdue for a scan
        id: age
        run: python3 -m regmon.schedule --config config/sources.json --data-dir data

      - name: Alert on stale monitoring data
        if: ${{ steps.age.outputs.stale == 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/regulatory-monitor.yml
        run: |
          message="${{ steps.age.outputs.count }} monitor(s) are overdue for a scan; the oldest was last scanned ${{ steps.age.outputs.hours }} hours ago. Check the Regulatory Monitor runs: $ACTIONS_URL"
          echo "$message"
          if [ -n "${NTFY_TOPIC:-}" ]; then
            curl -fsS -m 20 --retry 3 \
              -H "Title: Regulatory monitoring is stale" \
              -H "Priority: 4" \
              -H "Tags: hourglass,monitoring" \
              -H "Click: $ACTIONS_URL" \
              -d "$message" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
          exit 1
