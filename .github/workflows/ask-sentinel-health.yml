name: Ask Sentinel Backend Health

# Every live question spends the same Groq budget real users rely on (about 3.5k
# tokens each; the free tier allows a few hundred thousand a day). This check used
# to run seven live questions on every dashboard push, exhausted that budget on
# busy days and then failed on provider 429s. Live questions now run when the
# backend or its evaluator changes on main, once a day, and on demand; pull
# requests only check the deployed endpoint's health (they cannot change the
# deployed function anyway).
on:
  pull_request:
    paths:
      - ".github/workflows/ask-sentinel-health.yml"
      - "supabase/functions/ask-sentinel/**"
      - "supabase/migrations/**"
      - "scripts/ask_sentinel_live_eval.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ask-sentinel-health.yml"
      - "supabase/functions/ask-sentinel/**"
      - "supabase/migrations/**"
      - "scripts/ask_sentinel_live_eval.py"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ask-sentinel-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the deployed Groq-backed endpoint
        id: endpoint_health
        env:
          HEALTH_URL: https://pysoukwmnwwgilkwafdy.supabase.co/functions/v1/ask-sentinel?mode=health
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 5 --max-time 20 \
            "$HEALTH_URL" --output "$RUNNER_TEMP/ask-sentinel-health.json"
          python - "$RUNNER_TEMP/ask-sentinel-health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = (
              "groqConfigured",
              "groqApiKeyValid",
              "modelAvailable",
              "supabaseKeysConfigured",
          )
          missing = [key for key in required if status.get(key) is not True]
          if status.get("ok") is not True or missing:
              safe = {key: status.get(key) is True for key in required}
              print("Ask Sentinel backend health failed: " + json.dumps(safe))
              raise SystemExit(1)
          print("Ask Sentinel backend health passed: Groq key valid, model available, Supabase server keys present.")
          print("Repository: " + str(status.get("repository", "unknown")))
          print("Model: " + str(status.get("model", "unknown")))
          PY

      - name: Index the repository and ask a real Groq question
        # Pull requests cannot change the deployed function, so they never spend live questions.
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SUPABASE_URL: https://pysoukwmnwwgilkwafdy.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_t_0AGIVpjAkilfaN9ic1WQ_muQWzZTV
          ASK_SENTINEL_URL: https://pysoukwmnwwgilkwafdy.supabase.co/functions/v1/ask-sentinel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          import uuid

          base = os.environ["SUPABASE_URL"].rstrip("/")
          public_key = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          function = os.environ["ASK_SENTINEL_URL"].rstrip("/")
          visitor_id = str(uuid.uuid4())

          def request_json(url, method="GET", body=None, timeout=30):
              headers = {"apikey": public_key, "Accept": "application/json", "x-ask-sentinel-visitor-id": visitor_id}
              payload = None
              if body is not None:
                  payload = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=payload, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      raw = response.read()
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  message = raw.decode("utf-8", "replace")[:350]
                  raise RuntimeError(f"{method} {url.split('?')[0]} returned HTTP {error.code}: {message}") from None
              try:
                  value = json.loads(raw.decode("utf-8"))
              except Exception:
                  raise RuntimeError(f"{method} {url.split('?')[0]} returned non-JSON data") from None
              if not isinstance(value, dict):
                  raise RuntimeError(f"{method} {url.split('?')[0]} returned unexpected JSON")
              return value

          warm = request_json(function + "?mode=warm", timeout=175)
          if warm.get("ok") is not True or warm.get("indexed") is not True:
              raise RuntimeError("The repository warm-up did not complete: " + json.dumps({
                  "ok": warm.get("ok"), "indexed": warm.get("indexed"),
                  "error": warm.get("error"), "document_count": warm.get("document_count")
              }))
          if not isinstance(warm.get("document_count"), int) or warm["document_count"] < 1000:
              raise RuntimeError("The repository index appears incomplete: " + str(warm.get("document_count")) + " chunks.")

          report_url = "https://raw.githubusercontent.com/GauravDarwesh/ChangeSentinel/main/data/report.json"
          with urllib.request.urlopen(report_url, timeout=20) as response:
              report = json.loads(response.read().decode("utf-8"))
          expected_run = str(report.get("run_id", ""))
          if not expected_run:
              raise RuntimeError("Could not read the expected monitoring run ID from the committed report.")

          question = (
              "From the indexed committed ChangeSentinel records, summarize monitoring run "
              + expected_run
              + ". State its exact run ID, changed count, fetch errors, extraction errors, and source. "
                "If a field is unavailable in evidence, say so."
          )
          answer = request_json(function, method="POST", body={"question": question, "conversation": []}, timeout=45)
          text = answer.get("answer")
          if not isinstance(text, str) or len(text.strip()) < 40:
              raise RuntimeError("Ask Sentinel returned no usable answer.")
          if answer.get("model") != "openai/gpt-oss-20b":
              raise RuntimeError("Ask Sentinel reported an unexpected model: " + str(answer.get("model")))
          if answer.get("remaining") != 2:
              raise RuntimeError("One question should leave two daily requests; received " + str(answer.get("remaining")))
          if answer.get("indexed_commit") != warm.get("commit_sha"):
              raise RuntimeError("The answer used a different repository revision than the warm-up.")
          if expected_run not in text:
              raise RuntimeError("Ask Sentinel did not reproduce the exact run ID from the indexed report.")
          print("Ask Sentinel end-to-end test passed.")
          print("Indexed commit: " + str(warm.get("commit_sha")))
          print("Indexed document chunks: " + str(warm.get("document_count")))
          print("Monitoring run grounded: " + expected_run)
          print("Groq model: " + str(answer.get("model")) + "; remaining quota: " + str(answer.get("remaining")))
          print("Answer length: " + str(len(text)) + " characters; answer text omitted from CI logs.")
          PY

      - name: Check out dashboard data and grounding evaluator
        if: ${{ always() && steps.endpoint_health.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Evaluate live grounding against current dashboard records
        # A real grounding failure fails the run; provider outages are reported as warnings
        # unless no case could be evaluated at all.
        if: ${{ always() && steps.endpoint_health.outcome == 'success' && github.event_name != 'pull_request' }}
        env:
          ASK_SENTINEL_URL: https://pysoukwmnwwgilkwafdy.supabase.co/functions/v1/ask-sentinel
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_t_0AGIVpjAkilfaN9ic1WQ_muQWzZTV
        run: python scripts/ask_sentinel_live_eval.py
